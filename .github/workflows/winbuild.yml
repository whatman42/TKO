name: Windows Portable Build

# Produces dist/TKO/TKO.exe portable ZIP artifact.
# Does not modify trading logic. Tokocrypto-only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tko.spec'
      - 'tko_worker_entry.py'
      - 'scripts/build_windows.bat'
      - '.github/workflows/windows-portable-build.yml'

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        # actions/setup-python@v5.4.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests pandas numpy
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }

      - name: Safety scan (no force_live_gate, no secrets in entry)
        shell: pwsh
        run: |
          $app = Get-Content -Raw tokocrypto_bot/application.py
          if ($app -match 'force_live_gate') { throw 'force_live_gate must be ABSENT' }
          $entry = Get-Content -Raw tko_worker_entry.py
          if ($entry -match 'api_key\s*=\s*"[A-Za-z0-9]{8,}"') { throw 'embedded api key pattern found' }
          Write-Host 'SAFETY_SCAN_OK'

      - name: Build portable with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm tko.spec
          if (-not (Test-Path 'dist\TKO\TKO.exe')) { throw 'TKO.exe missing after build' }
          Get-Item 'dist\TKO\TKO.exe' | Format-List Name, Length, FullName

      - name: Smoke PAPER (live_unlocked=False)
        shell: pwsh
        run: |
          $out = 'smoke_paper_out.txt'
          $err = 'smoke_paper_err.txt'
          $p = Start-Process -FilePath 'dist\TKO\TKO.exe' -ArgumentList '--mode','PAPER','--poll-interval','2' -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 18
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 2 }
          $txt = ''
          if (Test-Path $out) { $txt += Get-Content -Raw $out }
          if (Test-Path $err) { $txt += Get-Content -Raw $err }
          Write-Host $txt
          if ($txt -notmatch 'live_unlocked=False') { throw 'PAPER smoke failed: expected live_unlocked=False' }
          if ($txt -match 'INITIALIZING LIVE') { throw 'PAPER must not initialize LIVE' }

      - name: Smoke LIVE without credentials (BLOCKED)
        shell: pwsh
        run: |
          $out = 'smoke_live_out.txt'
          $err = 'smoke_live_err.txt'
          $p = Start-Process -FilePath 'dist\TKO\TKO.exe' -ArgumentList '--mode','LIVE' -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err -Wait
          $txt = ''
          if (Test-Path $out) { $txt += Get-Content -Raw $out }
          if (Test-Path $err) { $txt += Get-Content -Raw $err }
          Write-Host $txt
          if ($txt -notmatch 'LIVE blocked|missing API credentials|HardLiveGate') {
            throw 'LIVE smoke failed: expected fail-closed block message'
          }
          if ($txt -match 'HTTP_POST|post_order_non_retry') {
            throw 'LIVE smoke failed: order POST must not occur'
          }
          Write-Host "LIVE_EXIT_CODE=$($p.ExitCode)"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          if (Test-Path 'TKO-Windows-Portable.zip') { Remove-Item 'TKO-Windows-Portable.zip' -Force }
          Compress-Archive -Path 'dist\TKO\*' -DestinationPath 'TKO-Windows-Portable.zip' -Force
          Get-Item 'TKO-Windows-Portable.zip' | Format-List Name, Length

      - name: Upload TKO-Windows-Portable artifact
        # actions/upload-artifact@v4.6.1
        uses: actions/upload-artifact@4bec3a09dc379233e4946f2735250001b662869f
        with:
          name: TKO-Windows-Portable
          path: TKO-Windows-Portable.zip
          if-no-files-found: error
