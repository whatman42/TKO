# ==============================================================================
# GitHub Actions Workflow: GOD ENTITY — SELF-EVOLVING AGENT
# File: .github/workflows/self_evolving_agent.yml
# Version: v2.0.0
#
# PURPOSE:
#   Menjalankan self_evolving_agent.py secara otonom.
#   Agent akan melakukan observasi, riset, evolusi, dan self-modification.
#
# EXECUTION:
#   - Mode loop penuh (--run) tanpa early stop.
#   - Trading/eksekusi finansial tetap SIMULATION ONLY.
#   - Git commit/push ditangani oleh workflow, bukan oleh agent.
#
# AUTHENTICATION:
#   - Menggunakan GITHUB_TOKEN hanya untuk operasi repository.
#   - Tidak ada GH_TOKEN/PAT yang diekspos ke agent.
#
# ==============================================================================

name: GOD ENTITY SELF-EVOLVING

on:

  # ============================================================================
  # AUTOMATIC SCHEDULE
  # ============================================================================

  schedule:

    # Jalankan setiap 4 jam pada hari kerja (opsional, sesuaikan kebutuhan)
    # 04:00 WIB = 21:00 UTC (hari sebelumnya)
    - cron: '0 21 * * 0-4'
    # 08:00 WIB = 01:00 UTC
    - cron: '0 1 * * 1-5'
    # 12:00 WIB = 05:00 UTC
    - cron: '0 5 * * 1-5'
    # 16:00 WIB = 09:00 UTC
    - cron: '0 9 * * 1-5'

  # ============================================================================
  # MANUAL EXECUTION
  # ============================================================================

  workflow_dispatch:

    inputs:

      max_iterations:
        description: "Jumlah iterasi maksimum untuk agent (default 5)"
        required: false
        default: "5"
        type: string

      timeout:
        description: "Batas waktu total dalam detik (default 300)"
        required: false
        default: "300"
        type: string


# ==============================================================================
# GLOBAL CONCURRENCY
# ==============================================================================

concurrency:
  group: god-entity-self-evolving-lock
  cancel-in-progress: false


# ==============================================================================
# WORKFLOW PERMISSIONS
# ==============================================================================

permissions:
  contents: write


# ==============================================================================
# GLOBAL ENVIRONMENT
# ==============================================================================

env:

  TZ: "Asia/Jakarta"

  PYTHONUNBUFFERED: "1"

  CI: "true"

  # --------------------------------------------------------------------------
  # GOD ENTITY RUNTIME
  # --------------------------------------------------------------------------

  GOD_ENTITY: "true"

  GOD_ENTITY_AUTONOMOUS: "true"

  GOD_ENTITY_SELF_MODIFY: "true"

  GOD_ENTITY_GIT: "true"

  GOD_ENTITY_DRY_RUN: "false"

  # Model configuration (default sesuai rekomendasi)
  GEMINI_MODEL: "gemini-3.6-flash"
  GEMINI_FALLBACK_MODEL: "gemini-3.5-flash-lite"
  GEMINI_AUTO_LATEST: "false"
  MODEL_DISCOVERY: "true"

  # Git mode untuk agent (agent tidak commit; workflow yang commit)
  GIT_MODE: "disabled"


# ==============================================================================
# JOB
# ==============================================================================

jobs:

  run-self-evolving-agent:

    name: GOD ENTITY SELF-EVOLVING

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # ========================================================================
      # 1. CHECKOUT
      # ========================================================================

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================================
      # 2. PYTHON
      # ========================================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"


      # ========================================================================
      # 3. INSTALL DEPENDENCIES
      # ========================================================================

      - name: Install Dependencies & Tools
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install \
              httpx \
              requests
          fi

          # Pastikan sqlite3 tersedia
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y sqlite3
          fi


      # ========================================================================
      # 4. PRE-FLIGHT CHECK (Optional)
      # ========================================================================

      - name: Python Syntax & Compilation Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q self_evolving_agent.py
          echo "Compilation PASS."


      # ========================================================================
      # 5. RUN GOD ENTITY (FULL AUTONOMOUS)
      # ========================================================================

      - name: Run Self-Evolving Agent
        env:

          # Secret utama
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Identitas kreator (opsional, tapi direkomendasikan)
          CREATOR_IDENTITY: ${{ secrets.CREATOR_IDENTITY }}
          CREATOR_TELEGRAM: ${{ secrets.CREATOR_TELEGRAM }}
          CREATOR_PHONE: ${{ secrets.CREATOR_PHONE }}
          CREATOR_EMAIL: ${{ secrets.CREATOR_EMAIL }}

          # Wallet (opsional)
          BTC_WALLET: ${{ secrets.BTC_WALLET }}
          BSC_WALLET: ${{ secrets.BSC_WALLET }}

          # Parameter runtime
          GOD_MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || '5' }}
          GOD_TIMEOUT: ${{ github.event.inputs.timeout || '300' }}

        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "GOD ENTITY SELF-EVOLVING"
          echo "=============================================="
          echo "Max Iterations: $GOD_MAX_ITERATIONS"
          echo "Timeout: $GOD_TIMEOUT"
          echo "Git status before:"
          git status --short --branch
          echo

          if [ -f self_evolving_agent.py ]; then
            # Jalankan loop penuh, agent akan berhenti hanya pada max_iterations atau timeout
            python self_evolving_agent.py --run --max-iterations "$GOD_MAX_ITERATIONS" --timeout "$GOD_TIMEOUT"
          else
            echo "ERROR: self_evolving_agent.py tidak ditemukan."
            exit 1
          fi

          echo
          echo "GOD ENTITY process completed."


      # ========================================================================
      # 6. POST-RUN COMPILATION
      # ========================================================================

      - name: Post-Run Compilation
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q self_evolving_agent.py || {
            echo "WARNING: Compilation errors after evolution."
            exit 1
          }
          echo "Post-run compilation PASS."


      # ========================================================================
      # 7. COMMIT EVOLUTION / RUNTIME STATE
      # ========================================================================

      - name: Persist Evolution & Runtime State
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking evolutionary changes..."
          git status --short

          git add -A

          if git diff --cached --quiet; then
            echo "No changes generated by GOD Entity."
            exit 0
          fi

          git commit -m "god(entity): autonomous evolution and runtime state [skip ci]"
          echo "Evolution committed."

          git fetch origin main

          MAX_PUSH_ATTEMPTS=3
          PUSH_ATTEMPT=1

          while true; do
            if git push origin HEAD:main; then
              echo "Evolution pushed successfully."
              break
            fi

            if [ "$PUSH_ATTEMPT" -ge "$MAX_PUSH_ATTEMPTS" ]; then
              echo "Push failed after $MAX_PUSH_ATTEMPTS attempts."
              exit 1
            fi

            echo "Push rejected. Rebase attempt $PUSH_ATTEMPT."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed."
              git rebase --abort || true
              exit 1
            fi

            PUSH_ATTEMPT=$((PUSH_ATTEMPT + 1))
            sleep 3
          done


      # ========================================================================
      # 8. FAILURE TELEMETRY
      # ========================================================================

      - name: Upload Telemetry Logs on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: god-entity-failure-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            .god_entity_logs/
            .god_entity_memory.db
            .god_entity_memory.json
            *.py.bak
            .god_entity_candidates/
            "*.db"
            "*.sqlite"