name: Windows Portable Build

# Manual run dari GitHub App / Actions UI
on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run PAPER + LIVE smoke tests after build"
        type: boolean
        default: true

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests pandas numpy
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

      - name: Safety scan
        shell: pwsh
        run: |
          $app = Get-Content -Raw tokocrypto_bot/application.py
          if ($app -match "force_live_gate") {
            throw "force_live_gate must be ABSENT from production"
          }
          Write-Host "SAFETY_SCAN_OK"

      - name: Build portable (PyInstaller tko.spec)
        shell: pwsh
        run: |
          if (-not (Test-Path tko.spec)) { throw "tko.spec missing" }
          if (-not (Test-Path tko_worker_entry.py)) { throw "tko_worker_entry.py missing" }
          python -m PyInstaller --noconfirm tko.spec
          if (-not (Test-Path "dist\TKO\TKO.exe")) {
            throw "TKO.exe missing after build"
          }
          Get-Item "dist\TKO\TKO.exe" | Format-List Name, Length, FullName

      - name: Smoke PAPER (live_unlocked=False)
        if: ${{ inputs.run_smoke }}
        shell: pwsh
        run: |
          $out = "smoke_paper_out.txt"
          $err = "smoke_paper_err.txt"
          $p = Start-Process -FilePath "dist\TKO\TKO.exe" `
            -ArgumentList "--mode","PAPER","--poll-interval","2" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err
          Start-Sleep -Seconds 18
          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }
          $txt = ""
          if (Test-Path $out) { $txt += Get-Content -Raw $out }
          if (Test-Path $err) { $txt += Get-Content -Raw $err }
          Write-Host $txt
          if ($txt -notmatch "live_unlocked=False") {
            throw "PAPER smoke failed: expected live_unlocked=False"
          }

      - name: Smoke LIVE without credentials (BLOCKED)
        if: ${{ inputs.run_smoke }}
        shell: pwsh
        run: |
          $out = "smoke_live_out.txt"
          $err = "smoke_live_err.txt"
          $p = Start-Process -FilePath "dist\TKO\TKO.exe" `
            -ArgumentList "--mode","LIVE" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err `
            -Wait
          $txt = ""
          if (Test-Path $out) { $txt += Get-Content -Raw $out }
          if (Test-Path $err) { $txt += Get-Content -Raw $err }
          Write-Host $txt
          if ($txt -notmatch "LIVE blocked|missing API credentials|HardLiveGate") {
            throw "LIVE smoke failed: expected fail-closed block"
          }
          Write-Host "LIVE_EXIT_CODE=$($p.ExitCode)"

      - name: Package ZIP
        shell: pwsh
        run: |
          if (Test-Path "TKO-Windows-Portable.zip") {
            Remove-Item "TKO-Windows-Portable.zip" -Force
          }
          Compress-Archive -Path "dist\TKO\*" -DestinationPath "TKO-Windows-Portable.zip" -Force
          Get-Item "TKO-Windows-Portable.zip" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TKO-Windows-Portable
          path: TKO-Windows-Portable.zip
          if-no-files-found: error